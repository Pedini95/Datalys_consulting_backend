name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'develop'
        type: string

jobs:
  manual-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        cd src
        pip install -r requirements.txt
        
    - name: Deploy to ${{ github.event.inputs.environment }}
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        key: ${{ secrets.HOSTINGER_SSH_KEY }}
        port: ${{ secrets.HOSTINGER_PORT }}
        script: |
          echo "🚀 Déploiement manuel vers ${{ github.event.inputs.environment }}"
          echo "📅 Date: $(date)"
          echo "🔗 Commit: ${{ github.sha }}"
          echo "👤 Auteur: ${{ github.actor }}"
          echo "🌿 Branche: ${{ github.event.inputs.branch }}"
          
          # Aller dans le répertoire du projet
          cd /opt/Datalys_consulting_backend
          
          # Mettre à jour vers la branche spécifiée
          git fetch origin
          git checkout ${{ github.event.inputs.branch }}
          git reset --hard origin/${{ github.event.inputs.branch }}
          
          # Exécuter le script de déploiement
          ./scripts/deploy-production.sh
          
          # Vérification finale
          echo "🔍 Vérification finale du déploiement..."
          if curl -f http://localhost:8082/health > /dev/null 2>&1; then
              echo "✅ Déploiement manuel réussi !"
              echo "🌐 API accessible sur: http://${{ secrets.HOSTINGER_HOST }}:8082"
          else
              echo "❌ Échec du déploiement manuel"
              exit 1
          fi 