name: Test Secrets Configuration

on:
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Test Secrets Availability
        run: |
          echo "Testing secrets configuration..."
          
          if [ -n "${{ secrets.REMOTE_HOST }}" ]; then
            echo "✅ REMOTE_HOST is configured"
            echo "Host: ${{ secrets.REMOTE_HOST }}"
          else
            echo "❌ REMOTE_HOST is missing"
          fi
          
          if [ -n "${{ secrets.REMOTE_USER }}" ]; then
            echo "✅ REMOTE_USER is configured"
            echo "User: ${{ secrets.REMOTE_USER }}"
          else
            echo "❌ REMOTE_USER is missing"
          fi
          
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "✅ SSH_PRIVATE_KEY is configured"
            echo "Key length: ${#SSH_PRIVATE_KEY} characters"
          else
            echo "❌ SSH_PRIVATE_KEY is missing"
          fi
          
          echo "Secrets test completed" 