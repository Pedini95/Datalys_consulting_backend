name: Test Application

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          # Installer pytest si des tests sont ajoutés
          # pip install pytest pytest-cov

      - name: Run basic checks
        run: |
          cd src
          # Vérifier la syntaxe Python
          python -m py_compile app.py
          python -m py_compile run.py
          echo "✅ Syntaxe Python OK"
          
          # Vérifier les imports
          python -c "import app; print('✅ Imports OK')"
          
          # Si des tests existent, les exécuter
          # python -m pytest tests/ -v --cov=src

      - name: Check Docker build
        run: |
          # Test de construction Docker (sans push)
          docker build -t test-image -f src/Dockerfile .
          echo "✅ Docker build OK" 