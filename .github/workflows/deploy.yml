name: 🚀 Deploy to Production

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
      
      - name: 📦 Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts
      
      - name: 🚀 Deploy to server
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            
            echo "════════════════════════════════════════════════════════════"
            echo "🚀 DÉPLOIEMENT AUTOMATIQUE - Datalys Consulting"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            
            # Variables
            APP_DIR="/root/datalys-backend"
            BACKUP_DIR="/backup/deployments"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            REPO_URL="https://github.com/Pedini95/Datalys_consulting_backend.git"
            
            # Créer le répertoire de backup si nécessaire
            mkdir -p $BACKUP_DIR
            
            echo "📋 Étape 1/7: Sauvegarde de la configuration actuelle..."
            if [ -d "$APP_DIR" ]; then
              cp -r $APP_DIR $BACKUP_DIR/backup_$TIMESTAMP || true
              echo "✅ Backup créé: $BACKUP_DIR/backup_$TIMESTAMP"
            else
              echo "ℹ️  Pas de backup (première installation)"
            fi
            echo ""
            
            echo "📥 Étape 2/7: Récupération du code depuis Git..."
            if [ -d "$APP_DIR/.git" ]; then
              cd $APP_DIR
              git fetch origin
              git reset --hard origin/develop
              echo "✅ Code mis à jour via git pull"
            else
              echo "ℹ️  Clonage du repository..."
              rm -rf $APP_DIR
              git clone -b develop $REPO_URL $APP_DIR
              cd $APP_DIR
              echo "✅ Repository cloné"
            fi
            echo ""
            
            echo "🔒 Étape 3/7: Vérification du fichier .env..."
            if [ ! -f .env ]; then
              echo "⚠️  Fichier .env manquant - création nécessaire"
              exit 1
            fi
            echo "✅ Fichier .env présent"
            echo ""
            
            echo "🐳 Étape 4/7: Reconstruction de l'image Docker..."
            echo "🗑️  Suppression de l'image existante..."
            docker rmi datalys_consulting_backend-datalys-api:latest || true

            echo "🧹 Nettoyage complet du cache Docker..."
            docker builder prune -af || true
            docker system prune -f || true
            echo "✅ Cache nettoyé"

            echo "🔨 Build SANS cache (installation complète des dépendances)..."
            export DOCKER_BUILDKIT=0
            docker build --no-cache -t datalys_consulting_backend-datalys-api:latest -f src/Dockerfile .
            echo "✅ Image Docker construite sans cache"
            echo ""
            
            echo "🔄 Étape 5/7: Arrêt du conteneur actuel..."
            docker stop datalys-api || true
            docker rm datalys-api || true
            echo "✅ Ancien conteneur supprimé"
            echo ""
            
            echo "🚀 Étape 6/7: Démarrage du nouveau conteneur..."
            # Créer le conteneur avec la bonne configuration
            docker run -d --name datalys-api \
              -p 8082:8082 \
              --add-host smtp.hostinger.com:172.65.255.143 \
              --env-file .env \
              --restart unless-stopped \
              datalys_consulting_backend-datalys-api:latest

            # Connecter au réseau MySQL
            docker network connect datalys-network datalys-api || true

            # Configurer les règles iptables pour SMTP
            iptables -I DOCKER-USER -i docker0 -j ACCEPT 2>/dev/null || true
            iptables -I DOCKER-USER -i br-+ -o eth0 -j ACCEPT 2>/dev/null || true

            echo "✅ Nouveau conteneur démarré et configuré"
            echo ""
            
            echo "⏳ Étape 7/7: Vérification du démarrage (30s)..."
            sleep 30
            
            # Vérifier que le conteneur tourne
            if docker ps | grep -q datalys-api; then
              echo "✅ Conteneur actif"
              
              # Test de santé
              if curl -s http://localhost:8082/health > /dev/null 2>&1; then
                echo "✅ API opérationnelle"
              else
                echo "⚠️  API ne répond pas encore (peut prendre quelques secondes)"
              fi
            else
              echo "❌ ERREUR: Le conteneur n'est pas démarré"
              echo "Logs du conteneur:"
              docker logs datalys-api --tail 50
              exit 1
            fi
            
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "✅ DÉPLOIEMENT TERMINÉ AVEC SUCCÈS"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            echo "📊 Informations:"
            echo "   • Version: $(git rev-parse --short HEAD)"
            echo "   • Date: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "   • Backup: $BACKUP_DIR/backup_$TIMESTAMP"
            echo ""
            echo "🔍 Vérifications:"
            docker ps --filter name=datalys-api --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""
          ENDSSH
      
      - name: 📧 Notification de succès
        if: success()
        run: |
          echo "✅ Déploiement réussi sur ${{ secrets.SSH_HOST }}"
      
      - name: ❌ Notification d'échec
        if: failure()
        run: |
          echo "❌ Échec du déploiement sur ${{ secrets.SSH_HOST }}"
          echo "Vérifiez les logs ci-dessus pour plus de détails"
