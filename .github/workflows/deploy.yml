name: Build & Deploy

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python imports
        run: |
          python3 scripts/check-imports.py
          
      - name: Check case sensitivity
        run: |
          python3 scripts/check-case-sensitivity-local.py

      - name: Enable BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "COMPOSE_DOCKER_CLI_BUILD=1" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/pedini95/datalys-consulting-backend:latest,ghcr.io/pedini95/datalys-consulting-backend:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          timeout: 20m
          script: |
            cd /opt/Datalys_consulting_backend
            echo "📥 Pull du code le plus récent..."
            git fetch origin
            git reset --hard origin/develop
            echo "🚀 Exécution du déploiement..."
            bash scripts/deploy.sh

      - name: Health Check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "🔍 Vérification rapide..."
            sleep 10
            
            # Health check ultra-rapide
            if curl -f --connect-timeout 5 --max-time 10 http://localhost:8082/health > /dev/null 2>&1; then
                echo "✅ Déploiement ultra-rapide réussi ! Application en ligne"
            else
                echo "⚠️ Application en cours de démarrage, vérification des logs..."
                cd /opt/Datalys_consulting_backend
                docker-compose -f docker-compose.deploy.yml logs --tail=5 datalys-api
            fi 