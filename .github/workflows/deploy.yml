name: Deploy to VPS

on:
  push:
    branches:
      - develop
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v3
      
      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: 82.112.253.137
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/Datalys_consulting_backend
            
            echo "📥 Pulling latest changes..."
            git pull origin ${{ github.ref_name }} || echo "Not a git repo, using rsync method"
            
            echo "🔄 Restarting backend..."
            docker-compose restart datalys-api
            
            echo "⏳ Waiting for startup..."
            sleep 10
            
            echo "✅ Deployment completed!"
            docker ps --filter 'name=datalys-api'
            
            echo "🌐 Testing API..."
            curl -f http://localhost:8082/health || echo "API not ready yet"
