name: 🚀 Deploy to Production

on:
  push:
    branches:
      - develop
  workflow_dispatch:  # Permet le déclenchement manuel

jobs:
  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🔐 Setup SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ Erreur: HOSTINGER_SSH_KEY secret n'est pas configuré"
            exit 1
          fi
          if [ -z "$SSH_HOST" ]; then
            echo "❌ Erreur: HOSTINGER_HOST secret n'est pas configuré"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          eval $(ssh-agent -s)
          ssh-add ~/.ssh/deploy_key
          echo "✅ SSH configuré avec succès"

      - name: 📦 Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts
          echo "✅ Serveur ajouté aux known hosts"
      
      - name: 🚀 Deploy to server
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=10 \
              -o TCPKeepAlive=yes \
              -o ConnectTimeout=300 \
              $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            
            echo "════════════════════════════════════════════════════════════"
            echo "🚀 DÉPLOIEMENT AUTOMATIQUE - Datalys Consulting"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            
            # Variables
            APP_DIR="/root/Datalys_consulting_backend"
            BACKUP_DIR="/backup/deployments"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            REPO_URL="https://github.com/Pedini95/Datalys_consulting_backend.git"
            
            # Créer le répertoire de backup si nécessaire
            mkdir -p $BACKUP_DIR
            
            echo "📋 Étape 1/7: Sauvegarde de la configuration actuelle..."
            if [ -d "$APP_DIR" ]; then
              cp -r $APP_DIR $BACKUP_DIR/backup_$TIMESTAMP || true
              echo "✅ Backup créé: $BACKUP_DIR/backup_$TIMESTAMP"
            else
              echo "ℹ️  Pas de backup (première installation)"
            fi
            echo ""
            
            echo "📥 Étape 2/7: Récupération du code depuis Git..."

            # Sauvegarder le .env s'il existe
            if [ -f "$APP_DIR/.env" ]; then
              echo "💾 Sauvegarde du fichier .env existant..."
              cp $APP_DIR/.env /tmp/.env.backup
              ENV_BACKED_UP=true
            else
              ENV_BACKED_UP=false
            fi

            if [ -d "$APP_DIR/.git" ]; then
              cd $APP_DIR
              git fetch origin
              git reset --hard origin/develop
              echo "✅ Code mis à jour via git pull"
            else
              echo "ℹ️  Clonage du repository..."
              rm -rf $APP_DIR
              git clone -b develop $REPO_URL $APP_DIR
              cd $APP_DIR
              echo "✅ Repository cloné"
            fi

            # Restaurer le .env
            if [ "$ENV_BACKED_UP" = true ]; then
              echo "♻️  Restauration du fichier .env..."
              cp /tmp/.env.backup .env
              rm /tmp/.env.backup
              echo "✅ Fichier .env restauré"
            fi
            echo ""

            echo "🔒 Étape 3/7: Vérification du fichier .env..."
            if [ ! -f .env ]; then
              echo "❌ ERREUR: Fichier .env manquant"
              echo "Le fichier .env doit être créé manuellement sur le serveur à cet emplacement:"
              echo "  $APP_DIR/.env"
              echo ""
              echo "Créez ce fichier avec toutes les variables d'environnement nécessaires,"
              echo "puis relancez le déploiement."
              exit 1
            fi
            echo "✅ Fichier .env présent"
            echo ""
            
            echo "🔄 Étape 4/7: Arrêt du conteneur actuel..."
            docker stop datalys-api || true
            docker rm datalys-api || true
            echo "✅ Ancien conteneur supprimé"
            echo ""

            echo "🐳 Étape 5/7: Reconstruction de l'image Docker..."
            echo "🔨 Build de l'image Docker (avec cache pour accélérer)..."
            # On utilise BuildKit pour un build plus rapide
            export DOCKER_BUILDKIT=1
            docker build -t datalys_consulting_backend-datalys-api:latest -f src/Dockerfile . 2>&1 | \
              while IFS= read -r line; do
                echo "$line"
                # Envoyer un keepalive toutes les 10 lignes
                if [ $((RANDOM % 10)) -eq 0 ]; then
                  echo "🔄 Build en cours..."
                fi
              done
            echo "✅ Image Docker construite"
            echo ""

            echo "📁 Étape 6/7: Création des dossiers et permissions..."
            mkdir -p src/static/logos src/static/files src/static/projects src/static/incidents src/logs uploads
            chown -R 999:999 src/static/logos src/static/files src/static/projects src/static/incidents src/logs uploads
            chmod -R 775 src/static/logos src/static/files src/static/projects src/static/incidents src/logs uploads
            echo "✅ Dossiers créés avec les bonnes permissions (UID/GID 999)"
            echo ""

            echo "🚀 Étape 7/7: Démarrage du nouveau conteneur..."
            # Créer le conteneur avec la bonne configuration
            docker run -d --name datalys-api \
              -p 8082:8082 \
              --add-host smtp.hostinger.com:172.65.255.143 \
              --env-file .env \
              -v /root/Datalys_consulting_backend/src/logs:/app/src/logs \
              -v /root/Datalys_consulting_backend/uploads:/app/uploads \
              -v /root/Datalys_consulting_backend/src/static:/app/src/static \
              --restart unless-stopped \
              datalys_consulting_backend-datalys-api:latest

            # Connecter au réseau MySQL
            docker network connect datalys-network datalys-api || true

            # Configurer les règles iptables pour SMTP
            iptables -I DOCKER-USER -i docker0 -j ACCEPT 2>/dev/null || true
            iptables -I DOCKER-USER -i br-+ -o eth0 -j ACCEPT 2>/dev/null || true

            echo "✅ Nouveau conteneur démarré et configuré"
            echo ""

            echo "⏳ Vérification du démarrage (30s)..."
            sleep 30
            
            # Vérifier que le conteneur tourne
            if docker ps | grep -q datalys-api; then
              echo "✅ Conteneur actif"
              
              # Test de santé
              if curl -s http://localhost:8082/health > /dev/null 2>&1; then
                echo "✅ API opérationnelle"
              else
                echo "⚠️  API ne répond pas encore (peut prendre quelques secondes)"
              fi
            else
              echo "❌ ERREUR: Le conteneur n'est pas démarré"
              echo "Logs du conteneur:"
              docker logs datalys-api --tail 50
              exit 1
            fi
            
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "✅ DÉPLOIEMENT TERMINÉ AVEC SUCCÈS"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            echo "📊 Informations:"
            echo "   • Version: $(git rev-parse --short HEAD)"
            echo "   • Date: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "   • Backup: $BACKUP_DIR/backup_$TIMESTAMP"
            echo ""
            echo "🔍 Vérifications:"
            docker ps --filter name=datalys-api --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo ""
          ENDSSH
      
      - name: 📧 Notification de succès
        if: success()
        run: |
          echo "✅ Déploiement réussi sur ${{ secrets.SSH_HOST }}"
      
      - name: ❌ Notification d'échec
        if: failure()
        run: |
          echo "❌ Échec du déploiement sur ${{ secrets.SSH_HOST }}"
          echo "Vérifiez les logs ci-dessus pour plus de détails"
