name: Deploy with Docker Compose + Registry Cache

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  # Configuration du registry Docker Hub
  REGISTRY: docker.io
  IMAGE_NAME: datalys-consulting/api
  # Alternative pour GHCR (GitHub Container Registry)
  # REGISTRY: ghcr.io
  # IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable Docker BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "COMPOSE_DOCKER_CLI_BUILD=1" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: datalys-api:latest
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "🚀 Déploiement avec Docker Compose..."
            
            cd /opt/Datalys_consulting_backend
            
            # Rendre le script exécutable
            chmod +x scripts/deploy-production.sh
            
            # Exécuter le script de déploiement
            ./scripts/deploy-production.sh

      - name: Final Health Check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "🔍 Vérification finale..."
            sleep 10
            
            # Vérification avec Docker Compose
            docker-compose ps | grep datalys-api || (echo "❌ Conteneur non trouvé" && exit 1)
            
            # Health check de l'application
            curl -f --connect-timeout 10 --max-time 30 http://localhost:8082/health || (echo "❌ Health check échoué" && exit 1)
            
            echo "✅ Déploiement réussi ! Application en ligne sur le port 8082"
            
            # Afficher les logs pour debug
            echo "📋 Logs du conteneur :"
            docker-compose logs --tail=10 datalys-api

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "🧹 Nettoyage des anciennes images..."
            # Nettoyage général des images non utilisées
            docker image prune -f 