name: Deploy to Kubernetes

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Déploiement manuel

env:
  REGISTRY: localhost:8081
  IMAGE_NAME: datalys/api
  KUBERNETES_NAMESPACE: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        pip install -r src/requirements.txt
        
    - name: Run tests
      run: |
        # Ajoutez vos tests ici
        echo "Running tests..."
        
    - name: Build Docker image
      run: |
        docker build -t $REGISTRY/$IMAGE_NAME:latest -f src/Dockerfile .
        
    - name: Push to registry
      run: |
        docker push $REGISTRY/$IMAGE_NAME:latest
        
    - name: Deploy to Kubernetes
      run: |
        # Copier les fichiers de configuration
        scp -r k8s/ user@82.112.253.137:/opt/Datalys_consulting_backend/
        
        # Se connecter au serveur et déployer
        ssh user@82.112.253.137 << 'EOF'
          cd /opt/Datalys_consulting_backend
          
          # Redémarrer les services si nécessaire
          docker start redis-db mysql-db registry || true
          
          # Redémarrer le deployment
          kubectl rollout restart deployment/datalys-api
          
          # Surveiller le déploiement
          kubectl rollout status deployment/datalys-api --timeout=300s
          
          # Vérifier les pods
          kubectl get pods -l app=datalys-api
        EOF
