name: 🚀 Deploy to Production

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: 🔨 Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Dockerfile.fast
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          COMMIT_SHA=${{ github.sha }}

  deploy:
    name: 🚀 Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
        
    - name: 🚀 Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no root@82.112.253.137 << 'EOF'
          cd /opt/Datalys_consulting_backend
          
          echo "📥 Pulling latest code..."
          git fetch origin develop
          git reset --hard origin/develop
          
          echo "🔄 Updating docker-compose with new image..."
          export IMAGE_TAG=${{ needs.build.outputs.image-tag }}
          
          echo "🚀 Rolling deployment..."
          docker-compose -f docker-compose.deploy.yml --profile production pull
          docker-compose -f docker-compose.deploy.yml --profile production up -d --no-deps datalys-api
          
          echo "⏳ Waiting for service to start..."
          sleep 30
          
          echo "🏥 Health check..."
          curl -f http://localhost:8082/health || {
            echo "❌ Health check failed, rolling back..."
            docker-compose -f docker-compose.deploy.yml --profile production logs datalys-api
            exit 1
          }
          
          echo "✅ Deployment successful!"
        EOF 