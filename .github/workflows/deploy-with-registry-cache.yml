name: Deploy with Registry Cache

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  # Configuration du registry Docker Hub
  REGISTRY: docker.io
  IMAGE_NAME: datalys-consulting/api
  # Alternative pour GHCR (GitHub Container Registry)
  # REGISTRY: ghcr.io
  # IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Enable BuildKit
        run: |
          echo "DOCKER_BUILDKIT=1" >> $GITHUB_ENV
          echo "COMPOSE_DOCKER_CLI_BUILD=1" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push with Registry Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "🚀 Déploiement avec cache registry..."
            
            # Pull de la nouvelle image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Arrêter et supprimer l'ancien conteneur
            docker stop datalys-api || true
            docker rm datalys-api || true
            
            # Démarrer le nouveau conteneur
            docker run -d \
              --name datalys-api \
              --restart unless-stopped \
              -p 8082:8082 \
              -v /opt/Datalys_consulting_backend/uploads:/app/src/static/files \
              -e FLASK_ENV=production \
              -e PYTHONPATH=/app/src \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            echo "✅ Conteneur déployé avec succès"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "🔍 Vérification de la santé de l'application..."
            sleep 30
            
            # Vérification du conteneur
            docker ps | grep datalys-api || (echo "❌ Conteneur non trouvé" && exit 1)
            
            # Health check de l'application
            curl -f --connect-timeout 10 --max-time 30 http://localhost:8082/health || (echo "❌ Health check échoué" && exit 1)
            
            echo "✅ Déploiement réussi ! Application en ligne sur le port 8082"
            
            # Nettoyage des anciennes images (optionnel)
            docker image prune -f

      - name: Cleanup old images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "🧹 Nettoyage des anciennes images..."
            # Garder seulement les 3 dernières images
            docker images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --format "table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}" | tail -n +2 | sort -k2 -r | tail -n +4 | awk '{print $1}' | xargs -r docker rmi || true 