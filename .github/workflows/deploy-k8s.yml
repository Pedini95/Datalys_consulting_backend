name: Deploy to Kubernetes VPS

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
  workflow_dispatch:  # Déploiement manuel

env:
  PYTHON_VERSION: '3.9'
  PROJECT_DIR: '/opt/Datalys_consulting_backend'
  NAMESPACE: 'datalys'

jobs:
  # Job de test et validation
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('src/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        cd src
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Lint with flake8
      run: |
        cd src
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Linting completed"
        
    - name: Check imports
      run: |
        cd src
        python -c "import app; print('✅ All imports successful')"
        
    - name: Validate configuration
      run: |
        cd src
        python -c "
        from config import Config
        print('✅ Configuration loaded successfully')
        print(f'Environment: {Config.ENV}')
        print(f'Database URI configured: {\"mysql\" in Config.SQLALCHEMY_DATABASE_URI}')
        "

  # Job de déploiement Kubernetes (seulement si les tests passent)
  deploy-k8s:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Kubernetes VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.K8S_HOST }}
        username: ${{ secrets.K8S_USERNAME }}
        key: ${{ secrets.K8S_SSH_KEY }}
        port: ${{ secrets.K8S_PORT }}
        script: |
          # Log du déploiement
          echo "🚀 Début du déploiement Kubernetes - $(date)"
          
          # Aller dans le répertoire du projet
          cd ${{ env.PROJECT_DIR }}
          
          # Sauvegarde de la version actuelle
          echo "📦 Sauvegarde de la version actuelle..."
          mkdir -p /opt/k8s-backup/deployments
          cp -r . "/opt/k8s-backup/deployments/backup_$(date +%Y%m%d_%H%M%S)"
          
          # Mise à jour du code
          echo "🔄 Mise à jour du code depuis Git..."
          git fetch origin
          git reset --hard origin/develop
          
          # Vérification de la configuration
          echo "🔧 Vérification de la configuration..."
          if [ ! -f "src/.env.local" ]; then
            echo "⚠️  Fichier .env.local non trouvé"
            exit 1
          fi
          
          # Vérification de Kubernetes
          echo "☸️  Vérification de Kubernetes..."
          kubectl get nodes
          kubectl get namespace ${{ env.NAMESPACE }}
          
          # Génération des secrets (si nécessaire)
          echo "🔐 Génération des secrets..."
          if [ ! -f "k8s/secrets.yaml" ]; then
            echo "⚠️  Fichier secrets.yaml non trouvé, génération automatique..."
            # Utiliser les valeurs par défaut ou les secrets GitHub
            ./k8s/generate-secrets.sh
          else
            echo "✅ Fichier secrets.yaml trouvé, mise à jour..."
            kubectl apply -f k8s/secrets.yaml -n ${{ env.NAMESPACE }}
          fi
          
          # Build de l'image Docker
          echo "🐳 Build de l'image Docker..."
          docker build -t datalys/api:latest -f src/Dockerfile .
          
          # Déploiement Kubernetes
          echo "🚀 Déploiement sur Kubernetes..."
          ./k8s/deploy.sh deploy
          
          # Vérification du déploiement
          echo "📋 Vérification du déploiement..."
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
          
          # Test de santé
          echo "🏥 Test de santé de l'application..."
          sleep 30
          
          # Test via NodePort
          NODE_PORT=$(kubectl get service datalys-api-service -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.ports[0].nodePort}')
          if [ -n "$NODE_PORT" ]; then
            if curl -f http://localhost:$NODE_PORT/health > /dev/null 2>&1; then
              echo "✅ Application en ligne via NodePort $NODE_PORT"
            else
              echo "❌ L'application ne répond pas sur le NodePort"
              kubectl logs -l app=datalys-api -n ${{ env.NAMESPACE }} --tail=20
            fi
          fi
          
          # Test via Ingress
          if curl -f http://localhost:30080/health > /dev/null 2>&1; then
            echo "✅ Application accessible via Ingress"
          else
            echo "⚠️  Application non accessible via Ingress"
          fi
          
          # Nettoyage des anciennes images Docker
          echo "🧹 Nettoyage des anciennes images Docker..."
          docker image prune -f
          
          # Nettoyage des anciennes sauvegardes (garder 5)
          echo "🧹 Nettoyage des anciennes sauvegardes..."
          cd /opt/k8s-backup/deployments
          ls -t | tail -n +6 | xargs -r rm -rf
          
          echo "🎉 Déploiement Kubernetes terminé avec succès - $(date)"
          
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Déploiement Kubernetes réussi sur ${{ secrets.K8S_HOST }}"
          echo "🌐 Application accessible via :"
          echo "   - NodePort: http://${{ secrets.K8S_HOST }}:30080"
          echo "   - Ingress: http://${{ secrets.K8S_HOST }}:30080"
        else
          echo "❌ Déploiement Kubernetes échoué sur ${{ secrets.K8S_HOST }}"
        fi 