apiVersion: apps/v1
kind: Deployment
metadata:
  name: datalys-api
  labels:
    app: datalys-api
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datalys-api
  template:
    metadata:
      labels:
        app: datalys-api
        version: "1.0.0"
    spec:
      containers:
      - name: datalys-api
        image: datalys/api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8081
          name: http
        env:
        # Configuration de base
        - name: FLASK_ENV
          value: "production"
        - name: ENV
          value: "production"
        - name: PYTHONPATH
          value: "/app/src"
        
        # Configuration de la base de données
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: db-host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: db-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: db-name
        
        # Configuration Redis
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: redis-host
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: redis-password
        
        # Configuration SMTP (Email)
        - name: MAIL_SERVER
          value: "smtp.hostinger.com"
        - name: MAIL_PORT
          value: "587"
        - name: MAIL_USE_TLS
          value: "True"
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: mail-username
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: mail-password
        - name: MAIL_DEFAULT_SENDER
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: mail-default-sender
        
        # Configuration de l'application
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: secret-key
        - name: SENDER_NAME
          value: "Datalys Consulting"
        - name: APP_URL
          value: "https://api.datalysconsulting.com"
        - name: TIME_OUT
          value: "120"
        - name: UPLOAD_FOLDER
          value: "/app/src/static/files"
        - name: LOG_FILE_PATH
          value: "/app/src/logs/datalys_consulting.log"
        
        # Configuration Flask
        - name: SERVER_NAME
          value: "api.datalysconsulting.com"
        - name: APPLICATION_ROOT
          value: "/"
        - name: PREFERRED_URL_SCHEME
          value: "https"
        
        # Configuration du webhook (optionnel)
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: datalys-secrets
              key: webhook-secret
              optional: true
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        volumeMounts:
        - name: uploads-volume
          mountPath: /app/src/static/files
          subPath: files
        - name: logs-volume
          mountPath: /app/src/logs
          subPath: logs
        
        # Sécurité
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        
        # Commandes de démarrage
        command: ["python"]
        args: ["run.py"]
        workingDir: /app/src
        
      # Volumes
      volumes:
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: datalys-uploads-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: datalys-logs-pvc
      
      # Sécurité du pod
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      
      # Restart policy
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: datalys-api-service
  labels:
    app: datalys-api
spec:
  selector:
    app: datalys-api
  ports:
  - name: http
    port: 80
    targetPort: 8081
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8081
    protocol: TCP
  type: LoadBalancer
  sessionAffinity: None
  externalTrafficPolicy: Local

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datalys-uploads-pvc
  labels:
    app: datalys-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ""

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: datalys-logs-pvc
  labels:
    app: datalys-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ""



---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datalys-api-ingress
  labels:
    app: datalys-api
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  tls:
  - hosts:
    - api.datalysconsulting.com
    secretName: datalys-api-tls
  rules:
  - host: api.datalysconsulting.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datalys-api-service
            port:
              number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: datalys-api-hpa
  labels:
    app: datalys-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: datalys-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60 