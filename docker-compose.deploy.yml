# ========================================
# DATALYS CONSULTING - DOCKER COMPOSE
# ========================================
# 
# Usage:
#   Development: docker-compose --profile development up -d
#   Production:  docker-compose --profile production up -d
#
# IMPORTANT - Configuration MySQL externe:
# Le service MySQL doit être configuré pour écouter sur l'IP publique:
# docker run -d --name mysql-db -p 82.112.253.137:3306:3306 --restart unless-stopped mysql:8.0
# 
# Si MySQL redémarre et écoute seulement sur 127.0.0.1:3306, reconfigurer avec:
# docker stop mysql-db && docker rm mysql-db
# docker run -d --name mysql-db -p 82.112.253.137:3306:3306 [options et volumes] mysql:8.0
#
# ========================================

version: '3.8'

# 🚀 DATALYS CONSULTING - DOCKER COMPOSE UNIFIÉ
# =============================================
# Fichier unique pour dev, staging et production
# MySQL fonctionne en externe (préservation de vos données)

services:
  # 🔧 SERVICE PRINCIPAL API
  datalys-api:
    image: ${IMAGE_REGISTRY:-datalys_consulting_backend-datalys-api}:${IMAGE_TAG:-latest}
    container_name: datalys-api
    restart: unless-stopped
    network_mode: host
    build:
      context: .
      dockerfile: src/Dockerfile.fast
      args:
        - BUILD_DATE=${BUILD_DATE:-}
        - COMMIT_SHA=${COMMIT_SHA:-}
    environment:
      # Database - MySQL externe existant (via réseau host)
      - DB_HOST=${DB_HOST:-82.112.253.137}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-datalys_consulting}
      - DB_USER=${DB_USER:-datalys}
      - DB_PASSWORD=${DB_PASSWORD:-datalysconsulting}
      
      # Redis - Accessible via localhost avec network_mode: host
      - REDIS_HOST=${REDIS_HOST:-82.112.253.137}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      
      # Email SMTP - Configuration SSL
      - MAIL_SERVER=${MAIL_SERVER:-smtp.hostinger.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USE_SSL=${MAIL_USE_SSL:-True}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-False}
      - MAIL_USERNAME=${MAIL_USERNAME:-datalysconsultingapp@datalysconsulting.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-Nonsse@123}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-datalysconsultingapp@datalysconsulting.com}
      
      # App Config
      - SECRET_KEY=${SECRET_KEY:-development-secret-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-secret-change-in-production}
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      
      # Versioning & Monitoring
      - APP_VERSION=${IMAGE_TAG:-latest}
      - BUILD_DATE=${BUILD_DATE:-}
      - COMMIT_SHA=${COMMIT_SHA:-}
      
    volumes:
      - ./src/static:/app/src/static
      - ./src/logs:/app/src/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production
      - development
    labels:
      - "com.datalys.service=api"
      - "com.datalys.version=${IMAGE_TAG:-latest}"
      - "com.datalys.environment=${ENVIRONMENT:-production}"

  # 🗄️ REDIS CACHE
  redis-db:
    image: redis:7-alpine
    container_name: redis-db
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-127.0.0.1:6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - production
      - development
    labels:
      - "com.datalys.service=redis"
      - "com.datalys.environment=${ENVIRONMENT:-production}"

  # 🔄 AUTO-UPDATE (Production uniquement)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_INTERVAL:-300}
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=true
    profiles:
      - production
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.datalys.service=watchtower"

volumes:
  redis_data:
    driver: local

# 📋 EXEMPLES D'UTILISATION :
# ==========================
# 
# 🔧 Développement local :
# docker-compose --profile development up
# 
# 🚀 Production avec image locale :
# docker-compose --profile production up
# 
# 🌟 Production avec image versionnée :
# IMAGE_TAG=v1.2.3 docker-compose --profile production up
# 
# 🔄 Déploiement zero-downtime :
# IMAGE_TAG=v1.2.3 ./scripts/deploy-zero-downtime.sh
#
# ✅ SÉCURITÉ: MySQL fonctionne en externe
# Vos données sont totalement préservées et sécurisées !
# 📡 RÉSEAU: API utilise network_mode: host pour accéder à MySQL/Redis 