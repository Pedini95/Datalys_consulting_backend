<!DOCTYPE html>
<html>
<head>
    <style>
        .email-container {
            /* max-width: 600px; */
            margin: auto;
        }
        .footer {
            width: 100%;
            text-align: left; /* Alignement du texte à gauche */
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #666;
        }
        .footer img {
            float: right; /* Pour tenter de pousser l'image à droite */
            width: 100px; /* Largeur fixe pour le logo */
        }
        @media only screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <div class="email-container" style="border: 1px solid #ddd; padding: 20px; font-family: Arial, sans-serif;">
        <h1 style="color: #333; text-align: center;">Connection parameters</h1>
        <p>Below are your Fiber Registration connection parameters</p>
        <p>Email: {{ emails[0] }}</p>
        <p>Password: {{ password }}</p>
        <!-- Plus de contenu -->
        <div class="footer">
            <p>Sent by Orange Liberia using KYC KYA <img src="{{ logo_url }}" alt="Logo" style="width: 50px;"></p>
        </div>
    </div>
</body>
</html>
